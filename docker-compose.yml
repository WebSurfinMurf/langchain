version: '3.8'

services:
  langserve:
    image: python:3.11-slim
    container_name: langserve
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
      - langchain_data:/data
    # Loopback-only: no public Traefik router, no LAN-reachable host port.
    # Consumers are deploy.sh's health check and test_example.py, both localhost.
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - traefik-net
      - qdrant-net
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=langchain_docs
    env_file:
      - ../secrets/langchain.env
    command: >
      sh -c "
      apt-get update && apt-get install -y curl &&
      pip install --no-cache-dir 'pydantic>=2.0,<3.0' 'fastapi>=0.100.0' langchain 'langserve>=0.0.30' langsmith langgraph langchain-qdrant qdrant-client langchain-openai langchain-community uvicorn[standard] sse-starlette typing-extensions &&
      python -m uvicorn server:app --host 0.0.0.0 --port 8000
      "
    # Traefik router removed 2026-07-31 (security remediation plan, Phase 1c):
    # langserve.ai-servicers.com served /docs and the model-backed invoke/stream
    # endpoints with no auth middleware. Zero programmatic consumers used the
    # public hostname. To restore, re-add traefik.enable / router labels here.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traefik-net:
    external: true
  qdrant-net:
    external: true

volumes:
  langchain_data:
    driver: local
